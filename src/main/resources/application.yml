spring:
  application:
    name: forefilm

  datasource:
    url: jdbc:postgresql://localhost:5432/forefilm
    driver-class-name: org.postgresql.Driver
    hikari:
      username: postgres
      password: 1234
      maximum-pool-size: 10
      minimum-idle: 10
  jpa:
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug